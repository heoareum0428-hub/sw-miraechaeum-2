<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>인공지능 비지도학습 체험하기</title>

    <!-- 화면 전체를 이미지로 저장하기 위한 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 전체 컨테이너 */
        .app-container {
            display: flex;
            width: 1050px;
            min-height: 820px;
            height: auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 2px solid #333;
        }

        /* 왼쪽: 동물 데이터베이스 영역 */
        .left-panel {
            width: 360px;
            background-color: #f8f9fa;
            border-right: 2px solid #ccc;
            display: flex;
            flex-direction: column;
            padding: 15px;
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #555;
            color: #222;
        }

        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-content: flex-start;
            overflow-y: auto;
            flex-grow: 1;
            height: 680px;
            max-height: 680px;
            padding: 8px;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        /* 오른쪽: 활동지 영역 */
        .right-panel {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #fff;
        }

        .header-box {
            border: 2px solid #333;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #fff;
        }

        .header-title-row {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #111;
            white-space: nowrap;
        }

        .header-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            padding-top: 5px;
            border-top: 1px dashed #ccc;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .info-input {
            border: none;
            border-bottom: 1px solid #333;
            outline: none;
            text-align: center;
            font-size: 14px;
            font-family: inherit;
            background: transparent;
        }

        .instruction-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 16px;
            padding: 2px 0;
        }

        .drop-zone-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        /* 그룹 패널 및 드롭존 */
        .drop-group {
            display: flex;
            border: 2px solid #333;
            min-height: 140px;
            height: auto;
            background-color: #fff;
        }

        .group-label {
            width: 70px;
            background-color: #e8f4f8;
            border-right: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            line-height: 1.3;
            flex-shrink: 0;
        }

        .right-panel .drop-zone {
            flex-grow: 1;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-content: flex-start;
            min-height: 135px;
            height: auto;
            transition:
                background-color 0.2s ease,
                min-height 0.2s ease;
            width: 580px;
        }

        .drop-zone.drag-over {
            background-color: #e3f2fd;
            border: 2px dashed #2196f3;
        }

        /* 드래그 시 가상 자리 */
        .card-placeholder {
            width: 85px;
            height: 110px;
            border: 2px dashed #2196f3;
            border-radius: 6px;
            background-color: rgba(33,150,243,0.1);
            flex-shrink: 0;
        }

        /* 동물 카드 */
        .animal-card {
            width: 85px;
            height: 110px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .animal-card:active {
            cursor: grabbing;
        }

        .animal-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* 하단 버튼 */
        .action-bar {
            margin-top: 15px;
            display: flex;
            justify-content: center;
        }

        .save-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition:
                background-color 0.2s,
                transform 0.1s;
        }

        .save-btn:hover {
            background-color: #219150;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<div
    class="app-container"
    id="capture-area"
>

    <!-- 왼쪽 동물 카드 영역 -->
    <div class="left-panel">

        <div class="panel-title">
            동물 데이터베이스
        </div>

        <div
            class="card-grid drop-zone"
            id="db-zone"
        ></div>

    </div>


    <!-- 오른쪽 활동지 영역 -->
    <div class="right-panel">

        <div class="header-box">

            <div class="header-title-row">
                3차시 | 컴퓨터도 공부를 해요
            </div>

            <div class="header-info-row">

                <div class="info-item">

                    <input
                        type="text"
                        class="info-input"
                        id="school-input"
                        style="width: 90px;"
                    >

                    초등학교

                </div>


                <div class="info-item">

                    <input
                        type="text"
                        class="info-input"
                        id="grade-input"
                        style="width: 35px;"
                    >

                    학년

                </div>


                <div class="info-item">

                    <input
                        type="text"
                        class="info-input"
                        id="class-input"
                        style="width: 35px;"
                    >

                    반

                </div>


                <div class="info-item">

                    <input
                        type="text"
                        class="info-input"
                        id="group-input"
                        style="width: 45px;"
                    >

                    모둠

                </div>

            </div>

        </div>


        <div class="instruction-bar">

            <span>
                그룹 1과 그룹 2로 분류해 봅시다.
            </span>

            <span>
                (비지도학습)
            </span>

        </div>


        <div class="drop-zone-container">

            <div class="drop-group">

                <div class="group-label">
                    1<br>그룹
                </div>

                <div
                    class="drop-zone"
                    id="group-1"
                ></div>

            </div>


            <div class="drop-group">

                <div class="group-label">
                    2<br>그룹
                </div>

                <div
                    class="drop-zone"
                    id="group-2"
                ></div>

            </div>


            <div class="drop-group">

                <div class="group-label">
                    추가<br>그룹
                </div>

                <div
                    class="drop-zone"
                    id="group-extra"
                ></div>

            </div>

        </div>

    </div>

</div>


<div class="action-bar">

    <button
        class="save-btn"
        id="save-button"
        onclick="saveResultImage()"
    >
        📸 결과 저장하기 (패들렛 제출용)
    </button>

</div>

    /* =========================================================
       기존 Apps Script 웹 앱 주소
       1-2차시와 같은 주소를 사용합니다.
       ========================================================= */

    const APPS_SCRIPT_URL =
        'https://script.google.com/macros/s/AKfycbw-GPlxMgH62ai8qjBAeB8cNl8sDMTMLusycFcEhTUEFctNnHri_TTX85B3as4kkz0rwA/exec';


    const dbZone =
        document.getElementById('db-zone');

    const dropZones =
        document.querySelectorAll('.drop-zone');

    const rows = 4;
    const cols = 5;


    /* =========================================================
       드래그 위치 표시용 Placeholder
       ========================================================= */

    const placeholder =
        document.createElement('div');

    placeholder.classList.add(
        'card-placeholder'
    );


    /* =========================================================
       동물 카드 이미지 생성
       ========================================================= */

    const img =
        new Image();

    img.crossOrigin =
        "Anonymous";

    img.src =
        base64Data;


    img.onload =
        function() {

            sliceImageToCards(
                img
            );
        };


    img.onerror =
        function() {

            createEmbeddedCards();
        };


    function sliceImageToCards(
        sourceImage
    ) {

        dbZone.innerHTML = '';

        const cardWidth =
            sourceImage.width / cols;

        const cardHeight =
            sourceImage.height / rows;


        let index = 0;


        for (
            let r = 0;
            r < rows;
            r++
        ) {

            for (
                let c = 0;
                c < cols;
                c++
            ) {

                const canvas =
                    document.createElement(
                        'canvas'
                    );


                canvas.width =
                    cardWidth;

                canvas.height =
                    cardHeight;


                const ctx =
                    canvas.getContext('2d');


                ctx.drawImage(
                    sourceImage,

                    c * cardWidth,
                    r * cardHeight,

                    cardWidth,
                    cardHeight,

                    0,
                    0,

                    cardWidth,
                    cardHeight
                );


                createCardElement(
                    canvas.toDataURL(
                        'image/png'
                    ),
                    index
                );


                index++;
            }
        }
    }


    /* =========================================================
       이미지 오류 시 임시 카드
       ========================================================= */

    function createEmbeddedCards() {

        dbZone.innerHTML = '';


        for (
            let i = 0;
            i < 20;
            i++
        ) {

            const canvas =
                document.createElement(
                    'canvas'
                );


            canvas.width = 100;
            canvas.height = 130;


            const ctx =
                canvas.getContext('2d');


            ctx.fillStyle =
                '#ffffff';

            ctx.fillRect(
                0,
                0,
                100,
                130
            );


            ctx.strokeStyle =
                '#e0e0e0';

            ctx.lineWidth =
                1;

            ctx.strokeRect(
                2,
                2,
                96,
                126
            );


            ctx.fillStyle =
                '#6c5ce7';

            ctx.beginPath();

            ctx.arc(
                85,
                15,
                7,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle =
                '#f8f9fa';

            ctx.fillRect(
                10,
                25,
                80,
                80
            );


            ctx.fillStyle =
                '#ff7675';

            ctx.beginPath();

            ctx.arc(
                15,
                118,
                5,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle =
                '#55efc4';

            ctx.beginPath();

            ctx.arc(
                28,
                118,
                5,
                0,
                Math.PI * 2
            );

            ctx.fill();


            createCardElement(
                canvas.toDataURL(
                    'image/png'
                ),
                i
            );
        }
    }


    /* =========================================================
       동물 카드 생성
       ========================================================= */

    function createCardElement(
        dataUrl,
        index
    ) {

        const card =
            document.createElement(
                'div'
            );


        card.classList.add(
            'animal-card'
        );


        card.setAttribute(
            'draggable',
            'true'
        );


        card.setAttribute(
            'id',
            `card-${index}`
        );


        const cardImg =
            document.createElement(
                'img'
            );


        cardImg.src =
            dataUrl;


        card.appendChild(
            cardImg
        );


        dbZone.appendChild(
            card
        );


        card.addEventListener(
            'dragstart',
            handleDragStart
        );


        card.addEventListener(
            'dragend',
            handleDragEnd
        );
    }


    let draggedCard =
        null;


    function handleDragStart(e) {

        draggedCard =
            this;


        e.dataTransfer.setData(
            'text/plain',
            this.id
        );


        setTimeout(
            () =>
                this.style.opacity =
                    '0.4',

            0
        );
    }


    function handleDragEnd() {

        this.style.opacity =
            '1';


        draggedCard =
            null;


        if (
            placeholder.parentNode
        ) {

            placeholder
                .parentNode
                .removeChild(
                    placeholder
                );
        }
    }


    /* =========================================================
       드래그 & 드롭
       ========================================================= */

    dropZones.forEach(
        zone => {

            zone.addEventListener(
                'dragover',
                (e) => {

                    e.preventDefault();

                    zone.classList.add(
                        'drag-over'
                    );


                    if (
                        draggedCard &&
                        !zone.contains(
                            placeholder
                        )
                    ) {

                        zone.appendChild(
                            placeholder
                        );
                    }
                }
            );


            zone.addEventListener(
                'dragleave',
                (e) => {

                    if (
                        !zone.contains(
                            e.relatedTarget
                        )
                    ) {

                        zone.classList.remove(
                            'drag-over'
                        );


                        if (
                            zone.contains(
                                placeholder
                            )
                        ) {

                            zone.removeChild(
                                placeholder
                            );
                        }
                    }
                }
            );


            zone.addEventListener(
                'drop',
                (e) => {

                    e.preventDefault();


                    zone.classList.remove(
                        'drag-over'
                    );


                    if (
                        zone.contains(
                            placeholder
                        )
                    ) {

                        zone.removeChild(
                            placeholder
                        );
                    }


                    if (
                        draggedCard
                    ) {

                        zone.appendChild(
                            draggedCard
                        );
                    }
                }
            );
        }
    );


    /* =========================================================
       학생 입력 정보
       ========================================================= */

    function getStudentInfo() {

        return {

            school:
                (
                    document
                        .getElementById(
                            'school-input'
                        )
                        .value || ''
                ).trim(),

            grade:
                (
                    document
                        .getElementById(
                            'grade-input'
                        )
                        .value || ''
                ).trim(),

            className:
                (
                    document
                        .getElementById(
                            'class-input'
                        )
                        .value || ''
                ).trim(),

            groupName:
                (
                    document
                        .getElementById(
                            'group-input'
                        )
                        .value || ''
                ).trim()
        };
    }


    function sanitizeFilePart(
        value
    ) {

        return (
            value || ''
        )
        .replace(
            /[\\/:*?"<>|]/g,
            '_'
        )
        .replace(
            /\s+/g,
            ' '
        )
        .trim();
    }


    /* =========================================================
       저장될 PNG 파일 이름
       ========================================================= */

    function makeFileName(
        info
    ) {

        const parts = [

            info.grade
                ? `${sanitizeFilePart(
                    info.grade
                  )}학년`
                : '',

            info.className
                ? `${sanitizeFilePart(
                    info.className
                  )}반`
                : '',

            info.groupName
                ? `${sanitizeFilePart(
                    info.groupName
                  )}모둠`
                : '',

            '3차시_비지도학습'

        ].filter(Boolean);


        return (
            parts.join('_') +
            '.png'
        );
    }


    /* =========================================================
       학생 컴퓨터에 PNG 저장
       ========================================================= */

    function downloadImage(
        dataUrl,
        fileName
    ) {

        const link =
            document.createElement(
                'a'
            );


        link.download =
            fileName;


        link.href =
            dataUrl;


        document.body
            .appendChild(
                link
            );


        link.click();


        link.remove();
    }


    /* =========================================================
       Apps Script로 전송
       ========================================================= */

    async function submitToGoogleSheet(
        dataUrl,
        fileName,
        info
    ) {

        const payload = {

            action:
                'submitWorksheet',

            lesson:
                '3차시',

            worksheetTitle:
                '컴퓨터도 공부를 해요 - 비지도학습',

            fileName:
                fileName,

            mimeType:
                'image/png',

            imageData:
                dataUrl.split(',')[1],

            school:
                info.school,

            grade:
                info.grade,

            className:
                info.className,

            groupName:
                info.groupName,

            submittedAt:
                new Date()
                    .toISOString()
        };


        const response =
            await fetch(
                APPS_SCRIPT_URL,
                {

                    method:
                        'POST',

                    redirect:
                        'follow',

                    headers: {

                        'Content-Type':
                            'text/plain;charset=utf-8'
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                `제출 서버 응답 오류 (${response.status})`
            );
        }


        const text =
            await response.text();


        if (
            !text
        ) {

            return {
                success: true
            };
        }


        try {

            const result =
                JSON.parse(
                    text
                );


            if (
                result.result ===
                'error'
            ) {

                throw new Error(
                    result.error ||
                    '구글 스프레드시트 제출에 실패했습니다.'
                );
            }


            return result;


        } catch (error) {

            if (
                error
                    instanceof
                    SyntaxError
            ) {

                return {
                    success: true,
                    raw: text
                };
            }


            throw error;
        }
    }


    /* =========================================================
       결과 이미지 저장 + 구글 제출
       ========================================================= */

    async function saveResultImage() {

        const target =
            document.getElementById(
                'capture-area'
            );


        const saveButton =
            document.getElementById(
                'save-button'
            );


        const info =
            getStudentInfo();


        /* 모둠 입력 확인 */

        if (
            !info.groupName
        ) {

            alert(
                '모둠을 입력한 뒤 저장해 주세요.'
            );

            return;
        }


        const fileName =
            makeFileName(
                info
            );


        const originalText =
            saveButton.textContent;


        try {

            saveButton.disabled =
                true;


            saveButton.textContent =
                '저장 및 제출 중...';


            const capturedCanvas =
                await html2canvas(
                    target,
                    {

                        scale:
                            2,

                        useCORS:
                            true,

                        backgroundColor:
                            '#ffffff',

                        width:
                            target.scrollWidth,

                        height:
                            target.scrollHeight,

                        windowWidth:
                            target.scrollWidth,

                        windowHeight:
                            target.scrollHeight,

                        scrollX:
                            0,

                        scrollY:
                            -window.scrollY,

                        logging:
                            false
                    }
                );


            const dataUrl =
                capturedCanvas
                    .toDataURL(
                        'image/png'
                    );


            /* 학생 컴퓨터에 저장 */

            downloadImage(
                dataUrl,
                fileName
            );


            /* 구글 드라이브 및 스프레드시트에 제출 */

            await submitToGoogleSheet(
                dataUrl,
                fileName,
                info
            );


            alert(
                '활동지가 이미지로 저장되었고, 교사용 구글 스프레드시트에도 제출되었습니다.'
            );


        } catch (error) {

            console.error(
                error
            );


            alert(

                '활동지 이미지는 저장되었지만, 구글 스프레드시트 제출 중 문제가 발생했습니다.\n\n' +

                (
                    error?.message ||
                    'Apps Script 설정을 확인해 주세요.'
                )
            );


        } finally {

            saveButton.disabled =
                false;


            saveButton.textContent =
                originalText;
        }
    }

</script>
